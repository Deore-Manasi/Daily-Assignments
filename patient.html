<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Registration Form</title>
  </head>
  <body>
    <h1>Patient Registration Form</h1>
    <p>Please fill in the details below to register.</p>

    <form action="/" method="post">
      <h2>Personal Information</h2>
      <label for="fullname">Full Name:</label>
      <input
        type="text"
        id="fullname"
        placeholder="Enter your full name"
        required
      />
      &nbsp;&nbsp;

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" required />
      &nbsp;&nbsp;

      <label for="gender">Gender:</label>
      <input type="radio" id="male" name="gender" value="Male" required />
      <label for="male">Male</label>

      <input type="radio" id="female" name="gender" value="Female" />
      <label for="female">Female</label>

      &nbsp;&nbsp;
      <br /><br />
      <hr />

      <h2>Contact Information</h2>
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        placeholder="yourname@gmail.com"
        required
      />
      &nbsp;&nbsp;

      <label for="phone">Phone Number:</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter phone number"
        pattern="[0-9]{10}"
        maxlength="10"
        required
      />
      &nbsp;&nbsp;
      <br /><br />

      <label for="address">Address:</label>
      <textarea
        id="address"
        rows="3"
        cols="30"
        placeholder="Enter your address"
        required
      ></textarea>
      &nbsp;&nbsp;
      <br /><br />
      <hr />

      <h2>Emergency Contact</h2>

      <label for="emergencyname">Contact Person Name:</label>
      <input type="text" id="emergencyname" required />
      &nbsp;&nbsp;

      <label for="emgphone">Emergency Phone:</label>
      <input
        type="tel"
        id="emgphone"
        pattern="[0-9]{10}"
        maxlength="10"
        required
      />
      &nbsp;&nbsp;

      <label for="relationship">Relationship:</label>
      <select id="relationship" required>
        <option value="">Select Relationship</option>
        <option value="Parent">Parent</option>
        <option value="Friend">Friend</option>
      </select>

      &nbsp;&nbsp;
      <br /><br />
      <hr />

      <h2>Medical Information</h2>

      <label for="reason">Select Reason:</label>
      <select id="reason" required>
        <option value="">Select Reason</option>
        <option value="General Checkup">General Checkup</option>
        <option value="Injury">Injury</option>
        <option value="Other">Other</option>
      </select>
      &nbsp;&nbsp;

      <label for="description">Describe Your Symptoms:</label>
      <textarea
        id="description"
        rows="4"
        cols="30"
        placeholder="Describe your reason for visit"
      ></textarea>
      &nbsp;&nbsp;
      <br /><br />
      <input type="checkbox" id="terms" value="accepted" required />
      <label for="terms"> I agree to T&C. </label>
      <br /><br />

      <button type="submit">Register Patient</button>
      <button type="reset">Reset Form</button>
    </form>
  </body>
</html>
